<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0062cc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00418c" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="#0d1117"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(10, 132, 255, 0.25)" stroke-width="6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(10, 132, 255, 0.45)" stroke-width="8"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="rgba(10, 132, 255, 0.7)" stroke-width="10"/>
  
  <!-- Radar sweep line -->
  <line x1="256" y1="256" x2="380" y2="132" stroke="#30d158" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Central Pulse Center -->
  <circle cx="256" cy="256" r="28" fill="#30d158" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  
  <!-- AirTag Ping target -->
  <circle cx="340" cy="170" r="12" fill="#0a84ff" filter="url(#glow)"/>
</svg>
